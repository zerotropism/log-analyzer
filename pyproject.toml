[project]
name = "log-analyzer"
version = "0.1.0"
description = "connection logs analyzer in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"
log-analyzer-gen = "log_analyzer.synthetic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]