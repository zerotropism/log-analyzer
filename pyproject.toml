[project]
name = "log-analyzer"
version = "0.1.0"
description = "connection logs analyzer in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6,<5",
    "pydantic>=2.14.3",
]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"
log-analyzer-gen = "log_analyzer.synthetic:main"
log-analyzer-mcp = "log_analyzer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
